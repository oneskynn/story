<style>
/* Layout: sticky header with three tabs; the active deck's slides stack in one centered column, each scaled to the column width */
:root {
  --bg: #ECE6DE;
  --surface: #F8F4EE;
  --fg: #2B2420;
  --muted: #6E6258;
  --accent: #9C4526;
  --accent-ink: #F7F2EA;
  --line: #D6CABC;
  --shadow: rgba(43, 36, 32, 0.14);
  --serif: 'Noto Serif KR', Georgia, serif;
  --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1714; --surface: #26201C; --fg: #F2EBE2; --muted: #B3A699;
    --accent: #E3B596; --accent-ink: #2B2420; --line: #3B322C; --shadow: rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1714; --surface: #26201C; --fg: #F2EBE2; --muted: #B3A699;
  --accent: #E3B596; --accent-ink: #2B2420; --line: #3B322C; --shadow: rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.top-inner {
  max-width: 1200px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 0;
  display: flex; flex-direction: column; gap: 14px;
}
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-family: var(--serif); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.brand span { font-size: 13px; color: var(--muted); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  appearance: none; border: 0; background: none; cursor: pointer;
  font: inherit; color: var(--muted);
  padding: 10px 14px 12px; border-bottom: 3px solid transparent;
  white-space: nowrap; display: flex; align-items: baseline; gap: 8px;
}
.tab b { font-weight: 700; font-size: 15px; }
.tab small { font-size: 12px; font-variant-numeric: tabular-nums; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }
main {
  max-width: 1200px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 64px;
}
.panel-head {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-bottom: 20px;
}
.panel-head h2 { margin: 0; font-family: var(--serif); font-size: 20px; font-weight: 700; text-wrap: balance; }
.panel-head a {
  color: var(--accent); font-size: 13px; font-weight: 500; text-decoration: none;
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
}
.panel-head a:hover { border-color: var(--accent); }
.slides { display: flex; flex-direction: column; gap: 28px; }
figure.slide { margin: 0; display: flex; flex-direction: column; gap: 8px; }
figure.slide figcaption { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.frame {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; overflow: hidden;
  border-radius: 6px; box-shadow: 0 1px 2px var(--shadow), 0 8px 24px var(--shadow);
  background: #F7F2EA;
}
.note { margin-top: 40px; font-size: 12px; color: var(--muted); }

/* Slide canvas: reproduces the slide editor's defaults so the copied slides look the same */
.frame > section {
  position: absolute; top: 0; left: 0; width: 1920px; height: 1080px;
  transform-origin: 0 0; box-sizing: border-box; overflow: hidden;
  color: #2B2420; font-family: var(--sans); font-size: 32px; line-height: 1.4;
  display: flex; flex-direction: column;
}
.frame section * { box-sizing: border-box; margin: 0; }
.frame section h1 { font-size: 96px; font-weight: 600; line-height: 1.1; }
.frame section h2 { font-size: 64px; font-weight: 600; line-height: 1.15; }
.frame section h3 { font-size: 44px; font-weight: 600; line-height: 1.2; }
.frame section p { font-size: 32px; }
.frame section hr { border: 0; border-top: 2px solid currentColor; }
.frame section img { object-fit: cover; display: block; max-width: none; }
.frame section aside { display: none; }
.frame section x-icon { display: block; flex: none; }
.frame section x-icon svg { width: 100%; height: 100%; display: block; }
.frame section x-shape { display: block; flex: none; }
.frame section .fill {
  display: inline-block; min-width: 3em; padding: 0 0.2em; outline: none; cursor: text;
  border-bottom: 3px dashed currentColor; border-radius: 4px 4px 0 0; white-space: pre-wrap;
}
.frame section .fill:empty::before { content: attr(data-ph); opacity: 0.5; }
.frame section .fill:hover { background: rgba(227, 181, 150, 0.22); }
.frame section .fill:focus { background: rgba(227, 181, 150, 0.4); border-bottom-style: solid; }
.save {
  font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px;
}
.save::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.save[data-state="saved"]::before { background: #4F8A5B; }
.save[data-state="saving"]::before { background: var(--accent); }
.save[data-state="error"]::before { background: #B3382C; }
.head-tools { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-left: auto; }
.save:not([data-state="error"]) { display: none; }
.save[data-state="error"] { margin-bottom: 16px; }
.hint-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.frame section x-shape[kind="arrow-right"] { clip-path: polygon(0 30%, 60% 30%, 60% 0, 100% 50%, 60% 100%, 60% 70%, 0 70%); }
</style>

<script>
(function () {
  var ICONS = {
    Tool: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/>',
    Users: '<circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.85"/>',
    Book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
    Chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    Globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
    GraduationCap: '<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',
    CheckCircle: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/>',
    Star: '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/>',
    Warning: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    Search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>',
    Lightbulb: '<path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/>',
    Play: '<path d="M5 3l14 9-14 9V3z"/>',
    Home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>'
  };
  document.querySelectorAll('.frame x-icon').forEach(function (el) {
    var inner = ICONS[el.getAttribute('name')];
    if (inner) el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
  });
  document.querySelectorAll('.frame img[data-crop]').forEach(function (img) {
    var parts = img.getAttribute('data-crop').trim().split(/\s+/);
    if (parts.length >= 3) img.style.objectPosition = parts[1] + ' ' + parts[2];
  });

  function fit(frame) {
    var s = frame.firstElementChild;
    if (s && frame.clientWidth) s.style.transform = 'scale(' + (frame.clientWidth / 1920) + ')';
  }
  var frames = document.querySelectorAll('.frame');
  if ('ResizeObserver' in window) {
    var ro = new ResizeObserver(function (entries) { entries.forEach(function (e) { fit(e.target); }); });
    frames.forEach(function (f) { ro.observe(f); });
  } else {
    var all = function () { frames.forEach(fit); };
    window.addEventListener('resize', all); all();
  }

  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var keys = tabs.map(function (t) { return t.dataset.key; });
  function show(key, focus) {
    if (keys.indexOf(key) < 0) key = keys[0];
    tabs.forEach(function (t) {
      var on = t.dataset.key === key;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
      if (on && focus) t.focus();
    });
    frames.forEach(fit);
  }
  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () {
      if (location.hash !== '#' + t.dataset.key) location.hash = t.dataset.key;
      else show(t.dataset.key);
      window.scrollTo(0, 0);
    });
    t.addEventListener('keydown', function (e) {
      var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (!d) return;
      e.preventDefault();
      var next = tabs[(i + d + tabs.length) % tabs.length];
      location.hash = next.dataset.key;
      show(next.dataset.key, true);
    });
  });
  window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });
  show(location.hash.slice(1));

  /* Kickoff blanks: type in place, autosave to the shared store (or this browser when the store is unavailable) */
  var fills = Array.prototype.slice.call(document.querySelectorAll('.fill'));
  var byId = {};
  fills.forEach(function (el) { byId[el.dataset.field] = el; });
  var statusEl = document.getElementById('save-status');
  var store = null, timers = {}, pending = 0;
  function setStatus(state, text) { statusEl.dataset.state = state; statusEl.textContent = text; }
  function clock() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function valueOf(el) { return el.textContent.replace(/\s+/g, ' ').trim().slice(0, 200); }

  fills.forEach(function (el) {
    try { var local = localStorage.getItem('kickoff:' + el.dataset.field); if (local) el.textContent = local; } catch (e) {}
  });

  function save(el, retried) {
    var id = el.dataset.field, v = valueOf(el);
    delete timers[id];
    if (!store) {
      try { localStorage.setItem('kickoff:' + id, v); setStatus('saved', '이 브라우저에만 저장됨 · ' + clock()); }
      catch (e) { setStatus('error', '저장할 수 없음'); }
      return;
    }
    pending++;
    store.collection('kickoff').doc(id).set({ value: v, updatedAt: new Date().toISOString() }).then(function () {
      pending--;
      if (!pending && !Object.keys(timers).length) setStatus('saved', '자동 저장됨 · ' + clock());
    }, function (err) {
      pending--;
      if (err && err.code === 'unavailable' && !retried) { setTimeout(function () { save(el, true); }, 800 + Math.random() * 800); return; }
      try { localStorage.setItem('kickoff:' + id, v); } catch (e) {}
      setStatus('error', '공유 저장 실패 · 이 브라우저에 임시 보관함');
    });
  }
  function schedule(el) {
    var id = el.dataset.field;
    clearTimeout(timers[id]);
    setStatus('saving', '저장 중');
    timers[id] = setTimeout(function () { save(el); }, 700);
  }
  fills.forEach(function (el) {
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
    el.addEventListener('paste', function (e) {
      e.preventDefault();
      var t = ((e.clipboardData || window.clipboardData).getData('text') || '').replace(/\s+/g, ' ');
      document.execCommand('insertText', false, t);
    });
    el.addEventListener('input', function () {
      if (!el.textContent) el.innerHTML = '';
      schedule(el);
    });
    el.addEventListener('blur', function () {
      if (timers[el.dataset.field]) { clearTimeout(timers[el.dataset.field]); save(el); }
    });
  });

  var c = window.claude;
  if (!c || typeof c.use !== 'function') {
    setStatus('idle', '이 브라우저에만 저장됨');
  } else {
    c.use('db').then(function (db) {
      if (!db) { setStatus('idle', '이 브라우저에만 저장됨'); return; }
      store = db;
      setStatus('saved', '자동 저장됨');
      db.collection('kickoff').onSnapshot(function (snap) {
        snap.docs.forEach(function (d) {
          var el = byId[d.id];
          if (!el || document.activeElement === el || timers[d.id]) return;
          var body = d.data() || {};
          var v = typeof body.value === 'string' ? body.value : '';
          if (el.textContent !== v) el.textContent = v;
        });
      }, function () { setStatus('error', '실시간 연결이 끊김 · 새로고침하면 다시 연결됨'); });
    }, function () { setStatus('idle', '이 브라우저에만 저장됨'); });
  }
})();
